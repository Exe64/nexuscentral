<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>feedhub</title>
    <!--
      No-flash guard (04-SPEC-frontend.md 5.1). Inline and before any stylesheet,
      on purpose: a module import would resolve after the first paint, and a dark
      user would see a white page for a frame. localStorage is the render-time
      cache; PostgreSQL is the source of truth and reconciles on boot.
    -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('feedhub.theme') || '{}');
          var mode = s.mode || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var d = document.documentElement;
          d.dataset.theme = dark ? 'dark' : 'light';
          if (s.hue != null) d.style.setProperty('--accent-h', s.hue);
          if (s.chroma != null) d.style.setProperty('--accent-c', s.chroma);
        } catch (e) {
          // A corrupt cache must not stop the page rendering; the default theme
          // in the stylesheet takes over.
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
